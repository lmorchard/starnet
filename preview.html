<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>STARNET — Visual Preview Harness</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Import map: bare "lit" specifiers → bundled dist/lit.js (overlay components + Lit UI components) -->
  <script type="importmap">
    { "imports": {
      "lit": "./dist/lit.js",
      "lit/directives/repeat.js": "./dist/lit.js"
    } }
  </script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #0a0a0f;
      color: #00ff41;
      font-family: "Courier New", monospace;
      font-size: 12px;
    }
    #preview-layout {
      display: flex;
      height: 100vh;
      width: 100vw;
    }

    /* ── Graph panel ───────────────────────────── */
    #graph-panel {
      flex: 1 1 65%;
      position: relative;
      overflow: hidden;
      background: #0a0a0f;
    }
    #graph-container {
      position: relative;
      width: 100%;
      height: 100%;
    }
    #cy {
      width: 100%;
      height: 100%;
    }

    /* ── Control panel ─────────────────────────── */
    #control-panel {
      flex: 0 0 320px;
      overflow-y: auto;
      padding: 12px 16px;
      border-left: 1px solid #1a3333;
      background: #0d0d14;
    }
    #control-panel h1 {
      font-size: 14px;
      color: #00ffff;
      margin: 0 0 12px 0;
      letter-spacing: 0.15em;
    }
    .section {
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #112222;
    }
    .section:last-child { border-bottom: none; }
    .section h2 {
      font-size: 11px;
      color: #00ffff;
      margin: 0 0 6px 0;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      border-bottom: 1px solid #003333;
      padding-bottom: 3px;
    }
    .section h3 {
      font-size: 10px;
      color: #888;
      margin: 8px 0 4px 0;
    }

    /* Slider */
    .effect-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 4px 0;
    }
    .effect-row label {
      flex: 0 0 50px;
      font-size: 10px;
      color: #668866;
    }
    .effect-row input[type="range"] {
      flex: 1;
      accent-color: #00ffff;
      height: 4px;
    }
    .effect-row .val {
      flex: 0 0 32px;
      font-size: 10px;
      color: #00ff41;
      text-align: right;
    }

    /* Buttons */
    .btn-row {
      display: flex;
      gap: 4px;
      margin: 4px 0;
      flex-wrap: wrap;
    }
    button {
      background: none;
      border: 1px solid #1a3333;
      color: #668866;
      font-family: inherit;
      font-size: 10px;
      padding: 3px 8px;
      cursor: pointer;
      letter-spacing: 0.05em;
    }
    button:hover {
      color: #00ffff;
      border-color: #00ffff;
    }
    button.active {
      color: #00ffff;
      border-color: #00ffff;
    }

    /* Speed control */
    .speed-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 6px 0;
    }
    .speed-row label { font-size: 10px; color: #668866; }
    .speed-row select {
      background: #0a0a0f;
      color: #00ff41;
      border: 1px solid #1a3333;
      font-family: inherit;
      font-size: 10px;
      padding: 2px 4px;
    }
  </style>
</head>
<body>
  <div id="preview-layout">
    <div id="graph-panel">
      <div id="graph-container">
        <div id="cy"></div>
        <!-- Node-anchored overlay animations mount here as NodeOverlay custom
             elements (see js/ui/overlays/), same as index.html. -->
        <div id="overlay-layer"></div>
      </div>
    </div>

    <div id="control-panel">
      <h1>STARNET PREVIEW</h1>

      <!-- Global controls -->
      <div class="section">
        <div class="speed-row">
          <label>Speed:</label>
          <select id="speed-select">
            <option value="0.5">0.5x</option>
            <option value="1" selected>1x</option>
            <option value="2">2x</option>
            <option value="4">4x</option>
          </select>
          <button id="btn-play-all">PLAY ALL</button>
          <button id="btn-reset-all">RESET ALL</button>
        </div>
      </div>

      <!-- SVG Overlay Effects — control rows generated from the overlay
           registry by js/ui/preview.js (one PLAY/RESET + scrub per effect). -->
      <div class="section">
        <h2>Overlay Effects</h2>
        <div id="overlay-controls"></div>

        <h3>Selection Reticle</h3>
        <div class="btn-row">
          <button id="btn-reticle-toggle">TOGGLE</button>
        </div>

        <h3>ICE Presence (Strike Cage)</h3>
        <div class="btn-row">
          <button id="btn-ice-toggle">SHOW</button>
          <button id="btn-ice-pulse">PULSE</button>
        </div>
      </div>

      <!-- Node Flash -->
      <div class="section">
        <h2>Node Flash</h2>
        <div class="btn-row">
          <button id="btn-flash-success">SUCCESS</button>
          <button id="btn-flash-failure">FAILURE</button>
          <button id="btn-flash-reveal">REVEAL</button>
        </div>
      </div>

      <!-- Card Gallery — real <starnet-hand> mounts fed a deterministic mock
           matrix (rarity × quality × wear × match), built by js/ui/preview-cards.js. -->
      <div class="section">
        <h2>Card Gallery</h2>
        <div id="card-gallery"></div>
      </div>

      <!-- Vuln Glyph Swatches — all 15 vuln-type glyphs (js/ui/vuln-glyphs.js),
           grouped by rarity tier, for legibility tuning at small size. -->
      <div class="section">
        <h2>Vuln Glyphs</h2>
        <div id="vuln-swatches"></div>
      </div>

      <!-- Node Shapes (display only) -->
      <div class="section">
        <h2>Node Shape Gallery</h2>
        <p style="color:#445544; font-size:10px; margin:2px 0;">Shapes + grade border colors shown in graph</p>
      </div>

      <!-- Alert States (display only) -->
      <div class="section">
        <h2>Alert States</h2>
        <p style="color:#445544; font-size:10px; margin:2px 0;">Green / Yellow / Red / Rebooting shown in graph</p>
      </div>
    </div>
  </div>

  <script src="dist/vendor.js"></script>
  <script type="module" src="js/ui/components/starnet-hand.js"></script>
  <script type="module" src="js/ui/preview.js"></script>
</body>
</html>
