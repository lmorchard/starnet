<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>audio-reference player</title>
  <script src="https://cdn.jsdelivr.net/npm/tone@15/build/Tone.js"></script>
  <style>
    body { font: 14px/1.5 system-ui, sans-serif; margin: 2rem; max-width: 720px; }
    h1 { font-size: 1.2rem; }
    .controls { margin: 1rem 0; display: flex; gap: .5rem; align-items: center; }
    button { font: inherit; padding: .3rem .8rem; }
    table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
    th, td { text-align: left; padding: .25rem .5rem; border-bottom: 1px solid #ddd; }
    .muted { opacity: .4; }
    #warnings { color: #b00; white-space: pre-wrap; }
    code { background: #f2f2f2; padding: 0 .25rem; }
    #library-section { margin: 1rem 0; }
    #library { list-style: none; padding: 0; margin: .5rem 0; }
    #library li { margin: .15rem 0; }
    #library button { width: 100%; text-align: left; cursor: pointer; }
    #library button.playing { font-weight: 600; outline: 2px solid #39c; }
  </style>
</head>
<body>
  <h1>audio-reference player</h1>
  <p>Pick an analyzed track below, or load a <code>docs/&lt;slug&gt;.json</code> file directly.
     The library list needs the served player (<code>uv run audio-reference play</code>); the
     file picker also works over <code>file://</code>.</p>
  <div class="controls">
    <input type="file" id="file" accept="application/json,.json" />
    <button id="play" disabled>▶ Play</button>
    <button id="stop" disabled>■ Stop</button>
    <span id="meta"></span>
  </div>
  <section id="library-section" style="display:none">
    <strong>Library</strong>
    <ul id="library"></ul>
  </section>
  <div id="warnings"></div>
  <table id="tracks"><tbody></tbody></table>
  <!-- Classic script (not type=module): ES modules are CORS-blocked over file:// in
       Chrome/Firefox, and player.js uses no import/export, so a classic script works. -->
  <script src="./player.js"></script>
</body>
</html>
