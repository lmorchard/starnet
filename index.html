<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STARNET</title>
  <link rel="stylesheet" href="css/style.css" />
  <!-- Import map: bare "lit" specifiers → bundled dist/lit.js -->
  <script type="importmap">
    { "imports": {
      "lit": "./dist/lit.js",
      "lit/directives/repeat.js": "./dist/lit.js"
    } }
  </script>
  <!-- Cytoscape.js + layout extensions (vendor bundle built by: make bundle-vendor) -->
  <script src="dist/vendor.js"></script>
</head>
<body>
  <div id="app">

    <!-- HUD -->
    <starnet-hud id="hud"></starnet-hud>

    <!-- Main area: graph column + sidebar -->
    <main id="main">
      <div id="graph-column">
        <div id="graph-container">
          <div id="cy"></div>
          <svg id="probe-sweep"
               style="position:absolute; opacity:0; pointer-events:none; overflow:visible; z-index:5; transition:opacity 0.15s ease;">
            <path id="probe-sweep-fill" fill="rgba(0,255,255,0.18)" />
            <circle id="probe-sweep-ring" fill="none" stroke="#00ffff" stroke-width="1" stroke-opacity="0.45" />
          </svg>
          <svg id="ice-detect-sweep"
               style="position:absolute; opacity:0; pointer-events:none; overflow:visible; z-index:5; transition:opacity 0.15s ease;">
            <path id="ice-detect-arc" fill="none" stroke="#ff00aa" stroke-width="4" stroke-linecap="round"/>
          </svg>
          <svg id="mine-scan"
               style="position:absolute; opacity:0; pointer-events:none; overflow:visible; z-index:5; transition:opacity 0.15s ease;">
            <line id="mine-scan-h" stroke="#cc00cc" stroke-width="2" stroke-opacity="0.5"/>
            <line id="mine-scan-v" stroke="#cc00cc" stroke-width="2" stroke-opacity="0.5"/>
            <rect id="mine-scan-box" fill="none" stroke="#ff44ff" stroke-width="1" stroke-opacity="0.9"/>
          </svg>
          <svg id="loot-rings"
               style="position:absolute; opacity:0; pointer-events:none; overflow:visible; z-index:5; transition:opacity 0.15s ease;">
          </svg>
          <svg id="read-sectors"
               style="position:absolute; opacity:0; pointer-events:none; overflow:visible; z-index:5; transition:opacity 0.15s ease;">
            <path id="read-sectors-fill" fill="rgba(0,255,65,0.15)" />
            <circle id="read-sectors-ring" fill="none" stroke="#00ff41" stroke-width="1" stroke-opacity="0.45" />
          </svg>
          <svg id="exploit-brackets"
               style="position:absolute; opacity:0; pointer-events:none; overflow:visible; z-index:5; transition:opacity 0.15s ease;">
            <defs>
              <filter id="zap-bloom" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
            </defs>
            <line id="bracket-tl-h" stroke="#cc00cc" stroke-width="1.5" stroke-opacity="0.9"/>
            <line id="bracket-tl-v" stroke="#cc00cc" stroke-width="1.5" stroke-opacity="0.9"/>
            <line id="bracket-tr-h" stroke="#cc00cc" stroke-width="1.5" stroke-opacity="0.9"/>
            <line id="bracket-tr-v" stroke="#cc00cc" stroke-width="1.5" stroke-opacity="0.9"/>
            <line id="bracket-br-h" stroke="#cc00cc" stroke-width="1.5" stroke-opacity="0.9"/>
            <line id="bracket-br-v" stroke="#cc00cc" stroke-width="1.5" stroke-opacity="0.9"/>
            <line id="bracket-bl-h" stroke="#cc00cc" stroke-width="1.5" stroke-opacity="0.9"/>
            <line id="bracket-bl-v" stroke="#cc00cc" stroke-width="1.5" stroke-opacity="0.9"/>
            <line id="zap-tl" class="exploit-zap" stroke="#ff44ff" stroke-width="0.75" stroke-opacity="0" filter="url(#zap-bloom)"/>
            <line id="zap-tr" class="exploit-zap" stroke="#ff44ff" stroke-width="0.75" stroke-opacity="0" filter="url(#zap-bloom)"/>
            <line id="zap-br" class="exploit-zap" stroke="#ff44ff" stroke-width="0.75" stroke-opacity="0" filter="url(#zap-bloom)"/>
            <line id="zap-bl" class="exploit-zap" stroke="#ff44ff" stroke-width="0.75" stroke-opacity="0" filter="url(#zap-bloom)"/>
          </svg>
          <svg id="selection-reticle"
               style="position:absolute; opacity:0; pointer-events:none; overflow:visible; z-index:6;">
            <g id="reticle-group">
              <circle id="reticle-ring" cx="30" cy="30" r="28"
                      fill="none"
                      stroke="#cc00cc"
                      stroke-width="1.5"
                      stroke-dasharray="6 3"
                      stroke-opacity="0.75"/>
              <line id="reticle-tick-n" stroke="#cc00cc" stroke-width="1.5" stroke-opacity="0.9"/>
              <line id="reticle-tick-s" stroke="#cc00cc" stroke-width="1.5" stroke-opacity="0.9"/>
              <line id="reticle-tick-e" stroke="#cc00cc" stroke-width="1.5" stroke-opacity="0.9"/>
              <line id="reticle-tick-w" stroke="#cc00cc" stroke-width="1.5" stroke-opacity="0.9"/>
            </g>
          </svg>
          <starnet-context-menu id="node-context-menu"
               style="position:absolute; opacity:0; pointer-events:none; z-index:10;">
          </starnet-context-menu>
          <starnet-action-choices id="action-choices">
          </starnet-action-choices>
          <starnet-store id="darknet-store"></starnet-store>
          <starnet-level-select id="level-select"></starnet-level-select>
        </div>
        <div id="log-pane">
          <starnet-log id="log-entries"></starnet-log>
          <div id="console-row">
            <span class="console-prompt">&gt;</span>
            <input id="console-input" type="text" autocomplete="off" spellcheck="false" placeholder="enter command..." />
          </div>
        </div>
      </div>

      <aside id="sidebar">
        <starnet-mission-pane id="sidebar-mission"></starnet-mission-pane>
        <starnet-node-panel id="sidebar-node"></starnet-node-panel>
        <starnet-hand id="hand-strip"></starnet-hand>
      </aside>
    </main>

    <starnet-end-screen id="end-screen"></starnet-end-screen>

  </div>

  <script type="module" src="js/ui/components/starnet-log.js"></script>
  <script type="module" src="js/ui/components/starnet-mission-pane.js"></script>
  <script type="module" src="js/ui/components/starnet-ice-timers.js"></script>
  <script type="module" src="js/ui/components/starnet-hud.js"></script>
  <script type="module" src="js/ui/components/starnet-context-menu.js"></script>
  <script type="module" src="js/ui/components/starnet-action-choices.js"></script>
  <script type="module" src="js/ui/components/starnet-node-panel.js"></script>
  <script type="module" src="js/ui/components/starnet-hand.js"></script>
  <script type="module" src="js/ui/components/starnet-end-screen.js"></script>
  <script type="module" src="js/ui/components/starnet-store.js"></script>
  <script type="module" src="js/ui/components/starnet-level-select.js"></script>
  <script type="module" src="js/ui/main.js"></script>
</body>
</html>
