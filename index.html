<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STARNET</title>
  <link rel="stylesheet" href="css/style.css" />
  <!-- Import map: bare "lit" specifiers → bundled dist/lit.js -->
  <script type="importmap">
    { "imports": {
      "lit": "./dist/lit.js",
      "lit/directives/repeat.js": "./dist/lit.js"
    } }
  </script>
  <!-- Cytoscape.js + layout extensions (vendor bundle built by: make bundle-vendor) -->
  <script src="dist/vendor.js"></script>
</head>
<body>
  <div id="app">

    <!-- HUD -->
    <starnet-hud id="hud"></starnet-hud>

    <!-- Main area: graph column + sidebar -->
    <main id="main">
      <div id="graph-column">
        <div id="graph-container">
          <div id="cy"></div>
          <!-- Node-anchored overlay animations mount here as NodeOverlay custom
               elements (see js/ui/overlays/). Each owns its own SVG skeleton. -->
          <div id="overlay-layer"></div>
          <!-- z-index 3: below the health-degradation canvas (z5) so the plasma overlays the
               node-action menu at high damage (lose GUI agency as your "eyes" fail — by design);
               still above the graph (z0) and below the true modals (store/level-select, z10). -->
          <starnet-context-menu id="node-context-menu"
               style="position:absolute; opacity:0; pointer-events:none; z-index:3;">
          </starnet-context-menu>
          <starnet-action-choices id="action-choices">
          </starnet-action-choices>
          <starnet-store id="darknet-store"></starnet-store>
          <starnet-level-select id="level-select"></starnet-level-select>
        </div>
        <div class="splitter splitter--row" data-resize="logH" title="Drag to resize — double-click to reset"></div>
        <div id="log-pane">
          <starnet-log id="log-entries"></starnet-log>
          <div id="console-row">
            <span class="console-prompt">&gt;</span>
            <input id="console-input" type="text" autocomplete="off" spellcheck="false" placeholder="enter command..." />
          </div>
        </div>
      </div>
      <div class="splitter splitter--col" data-resize="sidebarW" title="Drag to resize — double-click to reset"></div>

      <aside id="sidebar">
        <!-- Vital-sign traces: a stacked pair at the top of the sidebar. Canvas traces
             driven by visual-renderer.syncVitals (health / deck integrity). -->
        <div id="vital-stack">
          <starnet-waveform id="vital-ecg" class="vital-strip" autosize
            kind="ecg" color="var(--green)" label="HEALTH"
            h="44" speed="100" trail="0.72" bloom="14" meter></starnet-waveform>
          <starnet-waveform id="vital-deck" class="vital-strip" autosize
            kind="pulse" color="var(--violet)" label="DECK"
            h="44" speed="100" trail="0.72" bloom="14" meter></starnet-waveform>
        </div>
        <starnet-mission-pane id="sidebar-mission"></starnet-mission-pane>
        <starnet-node-panel id="sidebar-node"></starnet-node-panel>
        <div class="splitter splitter--row" data-resize="handH" title="Drag to resize — double-click to reset"></div>
        <starnet-hand id="hand-strip"></starnet-hand>
      </aside>
    </main>

    <starnet-end-screen id="end-screen"></starnet-end-screen>
    <starnet-hub id="overworld-hub"></starnet-hub>

  </div>

  <script type="module" src="js/ui/components/starnet-log.js"></script>
  <script type="module" src="js/ui/components/starnet-mission-pane.js"></script>
  <script type="module" src="js/ui/components/starnet-ice-timers.js"></script>
  <script type="module" src="js/ui/components/starnet-waveform.js"></script>
  <script type="module" src="js/ui/components/starnet-hud.js"></script>
  <script type="module" src="js/ui/components/starnet-context-menu.js"></script>
  <script type="module" src="js/ui/components/starnet-action-choices.js"></script>
  <script type="module" src="js/ui/components/starnet-node-panel.js"></script>
  <script type="module" src="js/ui/components/starnet-hand.js"></script>
  <script type="module" src="js/ui/components/starnet-end-screen.js"></script>
  <script type="module" src="js/ui/components/starnet-store.js"></script>
  <script type="module" src="js/ui/components/starnet-level-select.js"></script>
  <script type="module" src="js/ui/components/starnet-hub.js"></script>
  <script type="module" src="js/ui/main.js"></script>
</body>
</html>
